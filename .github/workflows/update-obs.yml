name: Update KRNO Observations

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules are not guaranteed to fire exactly on time.
    # Use staggered five-minute schedules to attempt a Synoptic refresh every minute.
    - cron: "0-59/5 * * * *"
    - cron: "1-59/5 * * * *"
    - cron: "2-59/5 * * * *"
    - cron: "3-59/5 * * * *"
    - cron: "4-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-krno-observations
  cancel-in-progress: true

jobs:
  update-obs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest repository state
        run: |
          git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Extract Synoptic observations only
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        run: |
          python scripts/extract_synoptic_obs.py

      - name: Validate generated JSON
        run: |
          python -m json.tool docs/observations.json > /dev/null
          python -m json.tool docs/obs.json > /dev/null
          python -m json.tool data/observations.json > /dev/null

      - name: Commit updated observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/observations.json || true
          git add docs/obs.json || true
          git add data/observations.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update KRNO observations"
            git push
          fi
