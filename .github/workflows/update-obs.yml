name: Update KRNO Observations

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-krno-observations
  cancel-in-progress: true

jobs:
  update-obs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests netCDF4 numpy

      - name: Extract Synoptic observations
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        run: |
          python scripts/extract_synoptic_obs.py

      - name: Extract GOES GLM lightning observations
        run: |
          python scripts/extract_glm_lightning.py

      - name: Commit updated observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/observations.json || true
          git add data/observations.json || true
          git add docs/lightning.json || true
          git add data/lightning.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update KRNO observations"
            git pull --rebase origin main
            git push
          fi
