name: Update KRNO GLM Lightning

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules can run late. Staggered five-minute schedules
    # ask GitHub to refresh the GLM proximity product about once per minute.
    - cron: "0-59/5 * * * *"
    - cron: "1-59/5 * * * *"
    - cron: "2-59/5 * * * *"
    - cron: "3-59/5 * * * *"
    - cron: "4-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-krno-glm-lightning
  cancel-in-progress: true

jobs:
  update-lightning:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest repository state
        run: |
          git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy netCDF4

      - name: Extract GOES-18 GLM lightning proximity
        run: |
          python scripts/extract_glm_lightning.py

      - name: Validate generated JSON
        run: |
          python -m json.tool docs/lightning.json > /dev/null
          python -m json.tool data/lightning.json > /dev/null

      - name: Commit updated lightning data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/lightning.json data/lightning.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update KRNO GLM lightning"
            git push
          fi
