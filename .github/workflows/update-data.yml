name: Update KRNO Ops DSS Data

on:
  workflow_dispatch:
  schedule:
    # Temporary discovery run every 6 hours.
    # Once REFS/HREF paths are verified, this will become the production model update.
    - cron: "45 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-krno-ops-dss-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Scan REFS/HREF AWS inventory
        run: |
          python scripts/scan_refs_aws_inventory.py

      - name: Verify inventory output exists
        run: |
          test -f data/refs_inventory_report.json
          echo "Inventory report created:"
          ls -lh data/refs_inventory_report.json

      - name: Commit inventory report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/refs_inventory_report.json || true

          git commit -m "Scan REFS HREF AWS inventory" || echo "No changes to commit"
          git push
