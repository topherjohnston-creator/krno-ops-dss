name: Update KRNO Ops DSS Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-krno-ops-dss-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Scan QMD wind inventory
        run: |
          python scripts/scan_qmd_wind_inventory.py

      - name: Commit scan output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/qmd_wind_inventory_scan.txt || true
          git status --short

          git commit -m "Scan QMD wind inventory" || echo "No changes to commit"
          git push
