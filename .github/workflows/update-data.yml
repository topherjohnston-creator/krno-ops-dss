name: Update KRNO Ops DSS Data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-krno-ops-dss-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3 botocore s3fs

      - name: Scan RRFS/REFS inventory
        run: |
          python scripts/scan_rrfs_refs_inventory.py

      - name: Build RRFS/REFS DSS outputs
        run: |
          python scripts/build_rrfs_dss_outputs.py

      - name: Commit updated DSS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -f data/repo_audit_report.json
          rm -f data/repo_audit_full.json
          rm -f data/*audit*.json

          git add docs/*.json || true
          git add data/*.json || true
          git add data/*.txt || true
          git add data/*.csv || true

          git reset -- data/repo_audit_report.json || true
          git reset -- data/repo_audit_full.json || true
          git reset -- data/*audit*.json || true

          git commit -m "Update KRNO Ops DSS RRFS data" || echo "No changes to commit"
          git push
