name: Update KRNO Ops DSS Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build mock risk outputs
        run: |
          python scripts/build_mock_outputs.py

      - name: Inspect NBM Core inventory
        run: |
          python scripts/inspect_nbm_inventory.py

      - name: Extract Synoptic observations
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        run: |
          python scripts/extract_synoptic_obs.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.json data/*.csv data/*.txt
          git commit -m "Update KRNO Ops DSS data and NBM inventory" || echo "No changes to commit"
          git push
