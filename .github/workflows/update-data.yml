name: Update KRNO Ops DSS Data

on:
  workflow_dispatch:
  schedule:
    # REFS/RRFS cycles run every 6 hours, but public files can arrive late.
    # Check hourly and let the scanner select the newest complete usable cycle.
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: update-krno-ops-dss-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3 botocore s3fs requests xarray cfgrib numpy pandas

      - name: Clean old NBM/QMD diagnostic products
        run: |
          echo "Removing old tracked/untracked diagnostic and legacy NBM/QMD data files..."

          rm -f data/repo_audit_report.json
          rm -f data/repo_audit_full.json
          rm -f data/*audit*.json
          rm -f data/*debug*.json

          rm -f data/rrfs_refs_inventory.json
          rm -f data/refs_hourly.json
          rm -f data/refs_dss_debug.json

          rm -f data/nbm_*.json
          rm -f data/nbm_*.txt
          rm -f data/nbm_*.csv
          rm -f data/qmd_*.json
          rm -f data/qmd_*.txt
          rm -f data/qmd_*.csv
          rm -f data/core_*.json
          rm -f data/core_*.txt
          rm -f data/core_*.csv
          rm -f data/test_*.json
          rm -f data/test_*.txt
          rm -f data/test_*.csv

          rm -f data/krno_wind_debug.json
          rm -f data/krno_snow_debug.json
          rm -f data/krno_lightning_debug.json
          rm -f data/krno_fzra_debug.json
          rm -f data/finalize_timeline_debug.json

          rm -f data/krno_wind_hourly.json
          rm -f data/krno_snow_hourly.json
          rm -f data/krno_lightning_hourly.json
          rm -f data/krno_fzra_hourly.json
          rm -f data/krno_wind_risk.json
          rm -f data/krno_snow_risk.json
          rm -f data/krno_lightning_risk.json
          rm -f data/krno_fzra_risk.json

      - name: Scan RRFS/REFS inventory
        run: |
          python scripts/scan_rrfs_refs_inventory.py

      - name: Print compact REFS diagnostics
        run: |
          echo "---- data files ----"
          ls -lh data || true

          echo "---- selected cycle summary ----"
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/rrfs_refs_selected_cycle.json")
          if not p.exists():
              print("MISSING data/rrfs_refs_selected_cycle.json")
              raise SystemExit(0)

          wrapper = json.loads(p.read_text())
          data = wrapper.get("selected_cycle") if isinstance(wrapper, dict) else None
          if not isinstance(data, dict):
              data = wrapper

          keys = data.get("keys", [])
          files = data.get("files", [])
          parsed_objects = data.get("parsed_objects", [])
          items = keys or files or parsed_objects

          print("wrapper keys:", list(wrapper.keys()) if isinstance(wrapper, dict) else type(wrapper).__name__)
          print("selected keys:", list(data.keys()))
          print("cycle_utc:", data.get("cycle_utc") or data.get("cycle"))
          print("cycle_label:", data.get("cycle_label"))
          print("prefix:", data.get("prefix"))
          print("usable:", data.get("usable"))
          print("products:", data.get("products"))
          print("idx_hours:", data.get("idx_hours"))
          print("grib_hours:", data.get("grib_hours"))
          print("item_count:", len(items))

          for i, item in enumerate(items[:80]):
              if isinstance(item, dict):
                  print(i, item.get("key") or item.get("name") or item)
              else:
                  print(i, item)
          PY

          echo "---- inventory txt ----"
          if [ -f data/rrfs_refs_inventory.txt ]; then
            head -200 data/rrfs_refs_inventory.txt
          else
            echo "MISSING data/rrfs_refs_inventory.txt"
          fi

      - name: Build compact REFS field map
        run: |
          python scripts/scan_refs_field_map.py

      - name: Build REFS DSS outputs
        run: |
          python scripts/build_refs_dss_outputs.py

      - name: Remove large products before staging
        run: |
          echo "Removing files that should never be committed..."

          rm -f data/repo_audit_report.json
          rm -f data/repo_audit_full.json
          rm -f data/*audit*.json
          rm -f data/*debug*.json

          rm -f data/rrfs_refs_inventory.json
          rm -f data/refs_hourly.json
          rm -f data/refs_dss_debug.json
          rm -f data/refs_dss_summary.json

      - name: Stage deletions for old legacy files
        run: |
          echo "Staging deletion of old NBM/QMD/Core/test/debug products..."

          git rm -f --ignore-unmatch data/repo_audit_report.json
          git rm -f --ignore-unmatch data/repo_audit_full.json
          git rm -f --ignore-unmatch data/*audit*.json
          git rm -f --ignore-unmatch data/*debug*.json

          git rm -f --ignore-unmatch data/rrfs_refs_inventory.json
          git rm -f --ignore-unmatch data/refs_hourly.json
          git rm -f --ignore-unmatch data/refs_dss_debug.json
          git rm -f --ignore-unmatch data/refs_dss_summary.json

          git rm -f --ignore-unmatch data/nbm_*.json
          git rm -f --ignore-unmatch data/nbm_*.txt
          git rm -f --ignore-unmatch data/nbm_*.csv
          git rm -f --ignore-unmatch data/qmd_*.json
          git rm -f --ignore-unmatch data/qmd_*.txt
          git rm -f --ignore-unmatch data/qmd_*.csv
          git rm -f --ignore-unmatch data/core_*.json
          git rm -f --ignore-unmatch data/core_*.txt
          git rm -f --ignore-unmatch data/core_*.csv
          git rm -f --ignore-unmatch data/test_*.json
          git rm -f --ignore-unmatch data/test_*.txt
          git rm -f --ignore-unmatch data/test_*.csv

          git rm -f --ignore-unmatch data/krno_wind_hourly.json
          git rm -f --ignore-unmatch data/krno_snow_hourly.json
          git rm -f --ignore-unmatch data/krno_lightning_hourly.json
          git rm -f --ignore-unmatch data/krno_fzra_hourly.json
          git rm -f --ignore-unmatch data/krno_wind_risk.json
          git rm -f --ignore-unmatch data/krno_snow_risk.json
          git rm -f --ignore-unmatch data/krno_lightning_risk.json
          git rm -f --ignore-unmatch data/krno_fzra_risk.json

      - name: Commit updated DSS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Frontend-required files.
          git add docs/threats.json || true
          git add docs/timeline.json || true

          if [ -f docs/observations.json ]; then
            git add docs/observations.json
          fi

          # Small REFS diagnostics only.
          git add data/rrfs_refs_inventory.txt || true
          git add data/rrfs_refs_selected_cycle.json || true
          git add data/refs_field_map.txt || true
          git add data/refs_field_map_summary.json || true
          git add data/refs_builder_summary.json || true

          # Final safety reset: never commit huge/generated raw files.
          git reset -- data/rrfs_refs_inventory.json || true
          git reset -- data/refs_hourly.json || true
          git reset -- data/refs_dss_debug.json || true
          git reset -- data/refs_dss_summary.json || true
          git reset -- data/repo_audit_report.json || true
          git reset -- data/repo_audit_full.json || true
          git reset -- data/*audit*.json || true
          git reset -- data/*debug*.json || true

          echo "---- git status before commit ----"
          git status --short

          git commit -m "Update KRNO Ops DSS REFS data" || echo "No changes to commit"
          git push
