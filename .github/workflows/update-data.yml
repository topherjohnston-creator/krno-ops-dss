name: Update KRNO Ops DSS Data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-krno-ops-dss-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3 botocore s3fs requests xarray cfgrib numpy pandas

      - name: Scan RRFS/REFS inventory
        run: |
          python scripts/scan_rrfs_refs_inventory.py

      - name: Build RRFS/REFS DSS outputs
        run: |
          python scripts/build_refs_dss_outputs.py

      - name: Remove large diagnostic files before staging
        run: |
          rm -f data/repo_audit_report.json
          rm -f data/repo_audit_full.json
          rm -f data/*audit*.json
          rm -f data/rrfs_refs_inventory.json
          rm -f data/refs_hourly.json
          rm -f data/refs_dss_debug.json
          rm -f data/*debug*.json

      - name: Commit updated DSS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only frontend-required products and small inventory summaries.
          git add docs/threats.json || true
          git add docs/timeline.json || true
          git add docs/observations.json || true

          git add data/rrfs_refs_inventory.txt || true
          git add data/rrfs_refs_selected_cycle.json || true

          # Make absolutely sure huge files are not staged.
          git reset -- data/rrfs_refs_inventory.json || true
          git reset -- data/refs_hourly.json || true
          git reset -- data/refs_dss_debug.json || true
          git reset -- data/repo_audit_report.json || true
          git reset -- data/repo_audit_full.json || true
          git reset -- data/*audit*.json || true
          git reset -- data/*debug*.json || true

          git status --short

          git commit -m "Update KRNO Ops DSS REFS data" || echo "No changes to commit"
          git push
