name: Update KRNO Ops DSS Data

on:
  workflow_dispatch:
  schedule:
    # REFS/NBM-style model update cycle.
    # Runs every 6 hours, offset by 45 minutes to allow data availability.
    - cron: "45 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-krno-ops-dss-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build REFS probability-based DSS outputs
        run: |
          python scripts/build_refs_dss_outputs.py

      - name: Finalize 60-hour timeline outputs
        run: |
          python scripts/finalize_timeline_outputs.py

      - name: Audit generated DSS outputs
        run: |
          python scripts/audit_repo_outputs.py || echo "::warning::Audit failed; continuing to commit usable outputs."

      - name: Remove oversized audit files before commit
        run: |
          rm -f data/repo_audit_report.json
          rm -f data/repo_audit_full.json
          rm -f data/*audit*.json
          rm -f docs/repo_audit_report.json
          rm -f docs/repo_audit_full.json
          rm -f docs/*audit*.json

      - name: Commit updated DSS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/*.json || true
          git add data/*.json || true
          git add data/*.csv || true
          git add data/*.txt || true

          git reset -- data/repo_audit_report.json || true
          git reset -- data/repo_audit_full.json || true
          git reset -- data/*audit*.json || true
          git reset -- docs/repo_audit_report.json || true
          git reset -- docs/repo_audit_full.json || true
          git reset -- docs/*audit*.json || true

          git commit -m "Update REFS KRNO Ops DSS data" || echo "No changes to commit"
          git push
