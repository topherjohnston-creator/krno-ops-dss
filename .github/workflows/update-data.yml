name: Update KRNO Ops DSS Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"

permissions:
  contents: write

concurrency:
  group: update-krno-ops-dss-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build mock baseline outputs
        run: |
          python scripts/build_mock_outputs.py

      - name: Build QMD probability-based wind outputs
        run: |
          python scripts/build_real_qmd_wind_outputs.py

      - name: Build Core probability-based visibility outputs
        run: |
          python scripts/build_real_core_visibility_outputs.py

      - name: Build QMD rain flooding outputs
        run: |
          python scripts/build_real_qmd_rain_outputs.py

      - name: Build Core snow probability outputs
        run: |
          python scripts/build_real_core_snow_outputs.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/*.json || true
          git add data/*.csv || true
          git add data/*.txt || true
          git add data/*.json || true

          git commit -m "Update KRNO Ops DSS data" || echo "No changes to commit"
          git push
