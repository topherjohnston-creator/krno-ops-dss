name: Update KRNO Ops DSS Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"

permissions:
  contents: write

concurrency:
  group: update-krno-ops-dss-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build QMD probability-based wind outputs
        run: |
          python scripts/build_real_qmd_wind_outputs.py || echo "Wind builder failed; preserving previous wind outputs"

      - name: Build Core probability-based visibility outputs
        run: |
          python scripts/build_real_core_visibility_outputs.py || echo "Visibility builder failed; preserving previous visibility outputs"

      - name: Build QMD rain flooding outputs
        run: |
          python scripts/build_real_qmd_rain_outputs.py || echo "Rain builder failed; preserving previous rain outputs"

      - name: Build Core snow probability outputs
        run: |
          python scripts/build_real_core_snow_outputs.py || echo "Snow builder failed; preserving previous snow outputs"

      - name: Build Core freezing rain outputs
        run: |
          python scripts/build_real_core_fzra_outputs.py || echo "Freezing rain builder failed; preserving previous FZRA outputs"

      - name: Build Core lightning probability outputs
        run: |
          python scripts/build_real_core_lightning_outputs.py || echo "Lightning builder failed; preserving previous lightning outputs"

      - name: Finalize timeline outputs
        run: |
          python scripts/finalize_timeline_outputs.py || echo "Timeline finalizer failed; preserving previous timeline"

      - name: Audit timeline hazard timing
        run: |
          python scripts/audit_timeline_hazard_timing.py || true

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/*.json || true
          git add data/*.csv || true
          git add data/*.txt || true
          git add data/*.json || true

          git reset -- data/repo_audit_report.json || true
          git reset -- data/repo_audit_full.json || true
          git reset -- data/*audit*.json || true

          git commit -m "Update KRNO Ops DSS data" || echo "No changes to commit"
          git push
