name: Update KRNO Ops DSS Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build mock baseline outputs
        run: |
          python scripts/build_mock_outputs.py

      - name: Build QMD probability-based wind outputs
        run: |
          python scripts/build_real_qmd_wind_outputs.py

      - name: Build Core probability-based visibility outputs
        run: |
          python scripts/build_real_core_visibility_outputs.py

      - name: Inspect NBM Core inventory
        run: |
          python scripts/inspect_nbm_inventory.py

      - name: Find NBM probability fields
        run: |
          python scripts/find_probability_fields.py

      - name: Inspect NBM QMD inventory
        run: |
          python scripts/inspect_qmd_inventory.py

      - name: Inspect Core visibility probability fields
        run: |
          python scripts/inspect_core_visibility_inventory.py

      - name: Inspect Core rain probability fields
        run: |
          python scripts/inspect_core_rain_inventory.py

      - name: Inspect QMD rain percentile fields
        run: |
          python scripts/inspect_qmd_rain_inventory.py

      - name: Test hourly QMD wind percentile extraction
        run: |
          python scripts/test_extract_qmd_wind_hourly.py

      - name: Test hourly QMD visibility diagnostic
        run: |
          python scripts/test_extract_qmd_visibility_hourly.py

      - name: Extract Synoptic observations
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        run: |
          python scripts/extract_synoptic_obs.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.json data/*.csv data/*.txt data/*.json
          git commit -m "Update KRNO Ops DSS data" || echo "No changes to commit"
          git push
